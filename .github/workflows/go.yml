name: Go

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
    
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.23.5
        
    - uses: Jerome1337/gofmt-action@v1.0.4
      with:
        gofmt-flags: '-l -d'

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.23.5
    
    - name: Set up dependencies
      run: sudo apt install libsdl2{,-gfx,-image,-ttf}-dev fonts-dejavu
      
    - uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        github-token: ${{ secrets.github_token }}
        args: --timeout=5m0s --exclude-use-default=false
        
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.23.5
        
    - name: Set up dependencies
      run: sudo apt install libsdl2{,-gfx,-image,-ttf}-dev fonts-dejavu

    - name: Build ubuntu
      run: go build -v ./...
    - name: Build Windows
      run:  GOOS=windows GOARCH=amd64 go build -v -trimpath -tags static -ldflags "-s -w -H windowsgui" ./...
    - name: Test
      run: go test -v ./...
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifact
        path: ./csgoverview.exe